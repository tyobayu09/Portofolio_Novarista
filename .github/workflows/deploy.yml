# ============================================================
#  DEPLOY KE GITHUB PAGES
# ============================================================
#  PENTING: ini harus jadi SATU-SATUNYA workflow deploy.
#  Sebelumnya ada dua file (deploy.yml + static.yml) yang sama-sama
#  ter-trigger pada push ke main. Keduanya berebut environment
#  github-pages, jadi hasil yang tayang bisa acak — kadang build
#  terbaru, kadang folder dist lama. Hapus static.yml.
#
#  Sekali saja di GitHub: Settings > Pages > Source = "GitHub Actions"
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy berjalan dalam satu waktu
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` lebih tepat daripada `npm install` untuk CI:
      # mengikuti package-lock.json persis, jadi hasil build
      # di server sama dengan di laptopmu.
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
